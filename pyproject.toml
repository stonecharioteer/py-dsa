[project]
name = "py-dsa"
version = "0.1.0"
description = "practice DSA concepts in Python"
readme = "README.md"
authors = [
    { name = "Vinay Keerthi", email = "11478411+stonecharioteer@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
]
web = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "django>=4.2.0",
    "flask>=2.3.0",
]
all = [
    "torch>=2.0.0",
    "torchvision>=0.15.0", 
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "django>=4.2.0",
    "flask>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
py-dsa = "py_dsa:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
markers = [
    "fundamentals: Fundamental data structures and algorithms exercises",
    "bfs: Breadth First Search exercises",
    "bfs_basic: Basic BFS exercises for beginners",
    "bfs_intermediate: Intermediate BFS exercises",
    "bfs_advanced: Advanced BFS exercises",
    "dp: Dynamic Programming exercises",
    "dp_basic: Basic DP exercises for beginners",
    "dp_intermediate: Intermediate DP exercises",
    "dp_advanced: Advanced DP exercises",
    "sliding_window: Sliding Window technique exercises",
    "sliding_window_basic: Basic sliding window exercises",
    "sliding_window_intermediate: Intermediate sliding window exercises",
    "sliding_window_advanced: Advanced sliding window exercises",
    "two_pointers: Two Pointers technique exercises",
    "two_pointers_basic: Basic two pointers exercises",
    "two_pointers_intermediate: Intermediate two pointers exercises",
    "two_pointers_advanced: Advanced two pointers exercises",
    "backtracking: Backtracking algorithm exercises",
    "backtracking_basic: Basic backtracking exercises",
    "backtracking_intermediate: Intermediate backtracking exercises",
    "backtracking_advanced: Advanced backtracking exercises",
    "linked_list: Linked List data structure exercises",
    "greedy: Greedy algorithm exercises",
    "union_find: Union Find (Disjoint Set) exercises",
    "bit_manipulation: Bit manipulation and bitwise operation exercises",
    "binary_search: Binary search algorithm exercises",
    "graph: Graph algorithms and traversal exercises",
    "stack_queue: Stack and Queue data structure exercises",
    "trie: Trie (Prefix Tree) data structure exercises",
    "heap: Heap and Priority Queue exercises",
    "blind150: Blind 150 LeetCode interview preparation exercises",
    "string_algorithms: String algorithm and pattern matching exercises",
    "string_algorithms_basic: Basic string algorithm exercises",
    "string_algorithms_intermediate: Intermediate string algorithm exercises", 
    "string_algorithms_advanced: Advanced string algorithm exercises",
    "sorting: Sorting algorithm exercises",
    "numpy: NumPy numerical computing exercises",
    "pandas: Pandas data manipulation exercises",
    "pytorch: PyTorch deep learning exercises",
    "pydantic: Pydantic data validation exercises",
    "fastapi: FastAPI web framework exercises",
    "easy: Easy difficulty level",
    "medium: Medium difficulty level",
    "hard: Hard difficulty level",
]
addopts = ["--cov=src", "--cov-report=html", "--cov-report=term-missing", "--cov-fail-under=80"]
testpaths = ["tests"]
